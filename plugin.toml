id = "profectus.latte"
name = "Latte"
version = "0.1.0"
description = "Latte template support for Nette: syntax highlighting, tags, n:attributes, autocomplete/completion, structure view outline, code folding and file icons."
authors = ["Filip Stencl", "OpenIDEA Community"]
license = "MIT"
change-notes = "0.1.0 — first release: .latte file detection, autocomplete/completion for conditions, tags, n:attributes, filters and variables, syntax highlighting, structure view outline, code folding, and file icons."
categories = ["languages", "frameworks"]
icon = "icon.svg"
icon-dark = "icon_dark.svg"
engines.openidea = "^1.2"
wasm = "dist/plugin.wasm"
activation = ["on-language:latte"]

[capabilities]
# Reading other templates of the project: Go to Definition and gutter markers
# for {include}, {layout}, {import} and blocks.
optional = ["project.read"]

[[contributes.languages]]
path = "languages/latte.toml"

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers"]
languages = ["latte"]

# Nette presenters: gutter icons from render<X>() / action<X>() to the template.
[[contributes.providers]]
kinds = ["line-markers"]
languages = ["php"]

[[contributes.fileIcons]]
id = "latte"
patterns = ["*.latte"]
icon = "icons/latte.svg"
iconDark = "icons/latte_dark.svg"

[[contributes.fileTemplates]]
id = "latte-template"
name = "Latte Template"
extension = "latte"
path = "templates/template.latte"
